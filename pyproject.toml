[project]
name = "dic"
version = "0.1.0"
description = "a minimalist CLI for chat LLMs"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
dic = "dic.__main__:main"
git-apply-fuzzy = "git_apply_fuzzy.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dic = ["models.json"]

[tool.pytest.ini_options]
markers = ["slow: starts a real dic process; left out of the default run"]
addopts = "-m 'not slow' --doctest-modules"
