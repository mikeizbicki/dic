# Defaults shipped with dic.  Do not edit: this file is replaced on upgrade.
# Write ~/.config/fac/models.yaml (or point $DIC_MODELS at a file) instead;
# its entries are searched first and may reuse a model_id to override one
# of these outright.
#
# With no -m, dic picks the first entry below whose api_key_name is set in
# the environment.

- model_id: sonnet
  model_name: claude-sonnet-4-5
  api_type: anthropic-messages
  api_base: https://api.anthropic.com/v1
  api_key_name: ANTHROPIC_API_KEY
  params:
    max_tokens: 8192

- model_id: gpt
  model_name: gpt-4.1
  api_type: openai-responses
  api_base: https://api.openai.com/v1
  api_key_name: OPENAI_API_KEY

- model_id: local
  model_name: local-model
  api_type: openai-chat
  api_base: http://localhost:8080/v1
  api_key_name: LOCAL_API_KEY
