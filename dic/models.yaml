# Defaults shipped with dic.  Do not edit: this file is replaced on upgrade.
# Write ~/.config/fac/models.yaml (or point $DIC_MODELS at a file) instead;
# its entries are searched first and may reuse a model_id to override one
# of these outright.
#
# With no -m, dic uses $DIC_MODEL if it is set; otherwise it picks the first
# entry below whose api_key_name is set in the environment.
#
# "options" holds the default request options for a model; -o KEY=VALUE on
# the command line overrides individual entries.
#
# "system" is a model's default system prompt.  It is used only when the
# conversation is a new one and neither -s nor $DIC_SYSTEM is given; -c and
# --mid always inherit the system prompt already stored in the thread.

- model_id: cerebras-qwen
  model_name: qwen-3.8-27b
  api_key_name: CEREBRAS_API_KEY
  api_base: https://api.cerebras.ai/v1
  cost_input: 0.0
  cost_output: 0.0

- model_id: groq-qwen
  model_name: qwen/qwen3.8-27b
  api_key_name: GROQ_API_KEY
  api_base: https://api.groq.com/openai/v1
  cost_input: 0.0
  cost_output: 0.0
  options:
    max_tokens: 200

- model_id: fable
  model_name: claude-fable-5-1
  api_key_name: ANTHROPIC_API_KEY
  api_base: https://api.anthropic.com/v1
  api_type: anthropic-messages
  cost_input: 10.0
  cost_output: 50.0

- model_id: sonnet
  model_name: claude-sonnet-4-5
  api_type: anthropic-messages
  api_base: https://api.anthropic.com/v1
  api_key_name: ANTHROPIC_API_KEY
  options:
    max_tokens: 8192

- model_id: gpt
  model_name: gpt-4.1
  api_type: openai-responses
  api_base: https://api.openai.com/v1
  api_key_name: OPENAI_API_KEY

- model_id: local
  model_name: local-model
  api_type: openai-chat
  api_base: http://localhost:8080/v1
  api_key_name: LOCAL_API_KEY
